  <script>
    (async () => {
      const target = document.getElementById("md-body");
      try {
        const res = await fetch("assets/xw-arch.md");
        if (!res.ok) throw new Error(res.status);
        const md = await res.text();

        // 字体就绪（带 900ms 兜底）+ 骨架至少一拍，再渲染全文
        const fontsIn = Promise.race([
          (document.fonts && document.fonts.ready) || Promise.resolve(),
          new Promise(r => setTimeout(r, 900))
        ]);
        await Promise.all([fontsIn, new Promise(r => setTimeout(r, 120))]);

        target.innerHTML = marked.parse(md);

        // 给章节标题加锚点，并生成目录（只列章节级：第X章/导读/附录）
        const heads = [...target.querySelectorAll("h1, h2")];
        const toc = document.getElementById("doc-toc-list");
        const chapRe = /^(第.+章|导读|附录)/;
        heads.forEach((h, i) => {
          h.id = "ch-" + (i + 1);
          if (chapRe.test(h.textContent.trim())) {
            const li = document.createElement("li");
            li.innerHTML = `<a href="#ch-${i + 1}">${h.textContent}</a>`;
            toc.appendChild(li);
          }
        });
        if (!toc.children.length) toc.parentElement.style.display = "none";
      } catch (err) {
        target.innerHTML = `<p>全文加载失败（${err.message}）。请通过本地服务器访问，例如 <code>python -m http.server</code>，不要直接双击文件打开。</p>`;
      }
    })();
  </script>
